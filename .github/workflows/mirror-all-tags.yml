name: mirror-all-tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the tags that would be mirrored"
        required: false
        type: boolean
        default: false

# One-off / re-runnable backfill: mirrors EVERY tag that exists on GHCR to the
# Docker Hub mirror, so both registries carry an identical tag set with
# identical digests (1:1). The tag list is read live from GHCR — nothing is
# hardcoded, so re-running this is always safe and idempotent.
#
# Normal releases do NOT need this workflow: publish-image.yml mirrors the new
# version tag + :beta on every push, promote-latest.yml keeps :latest in sync.
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REPO_SLUG: ${{ github.repository }}
      DH_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect tag list from GHCR
        run: |
          python3 - <<'PY' > tags.txt
          import json, os, urllib.request
          repo = os.environ["REPO_SLUG"]
          tok = json.load(urllib.request.urlopen(
              f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io", timeout=30))["token"]
          lst = json.load(urllib.request.urlopen(urllib.request.Request(
              f"https://ghcr.io/v2/{repo}/tags/list", headers={"Authorization": "Bearer " + tok}), timeout=30))
          for t in sorted(lst.get("tags") or []):
              print(t)
          PY
          echo "Tags on GHCR: $(wc -l < tags.txt)"

      - name: Mirror every tag to Docker Hub
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          n=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create --tag "$DH_REPO:$tag" "ghcr.io/$REPO_SLUG:$tag"
            n=$((n + 1))
            echo "mirrored ($n): $tag"
          done < tags.txt
          echo "mirrored $n tags"

      - name: Verify 1:1 (tag set + digest per tag)
        if: ${{ inputs.dry_run == false }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["REPO_SLUG"]
          dh = os.environ["DH_REPO"].replace("docker.io/", "")
          accept = "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json"

          def token(kind):
              if kind == "ghcr":
                  return json.load(urllib.request.urlopen(
                      f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io", timeout=30))["token"]
              return json.load(urllib.request.urlopen(
                  f"https://auth.docker.io/token?service=registry.docker.io&scope=repository:{dh}:pull", timeout=30))["token"]

          def digest(kind, tag):
              host = "ghcr.io/v2/" + repo if kind == "ghcr" else "registry-1.docker.io/v2/" + dh
              req = urllib.request.Request(f"https://{host}/manifests/{tag}",
                  headers={"Authorization": "Bearer " + token(kind), "Accept": accept})
              try:
                  return urllib.request.urlopen(req, timeout=30).headers.get("Docker-Content-Digest")
              except urllib.error.HTTPError as e:
                  return None if e.code == 404 else f"HTTP {e.code}"

          tags = [t.strip() for t in open("tags.txt") if t.strip()]
          missing, mismatch = [], []
          for t in tags:
              a, b = digest("ghcr", t), digest("docker.io", t)
              if b is None:
                  missing.append(t)
              elif a != b:
                  mismatch.append((t, a, b))
          print(f"tags checked: {len(tags)}")
          print(f"missing on Docker Hub: {len(missing)} {missing[:10]}")
          print(f"digest mismatches    : {len(mismatch)} {[m[0] for m in mismatch][:10]}")
          if missing or mismatch:
              print("::error::mirror is NOT 1:1")
              raise SystemExit(1)
          print("1:1 verified - every GHCR tag exists on Docker Hub with the same digest")
          PY
