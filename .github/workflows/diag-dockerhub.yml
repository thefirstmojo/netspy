name: diag-dockerhub

on:
  workflow_dispatch:

# Content verification: pulls the published images and prints the version baked
# into them (/app/VERSION). Digest equality alone would not prove that :latest
# really carries the approved release.
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR + Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Version baked into each published tag
        run: |
          set -x
          for ref in \
            ghcr.io/${{ github.repository }}:latest \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:latest \
            ghcr.io/${{ github.repository }}:beta \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:beta \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:v0.7.35 ; do
            docker pull -q "$ref" >/dev/null
            printf 'VERSION-CHECK %s -> %s\n' "$ref" "$(docker run --rm "$ref" cat /app/VERSION)"
            printf 'DIGEST-CHECK  %s -> %s\n' "$ref" "$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | sed 's/.*@//')"
          done
