name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Docker Hub mirror is skipped automatically while the secrets are absent
    # (fork / fresh clone stays green). Set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
    # to enable it.
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        # Tag push -> the pushed tag; manual run -> VERSION from the repo,
        # so both triggers produce the same image tag.
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            v="${GITHUB_REF_NAME}"
          else
            v="v$(cat VERSION)"
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "resolved version tag: $v"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:beta
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}

      # ---- Docker Hub mirror (same manifest, no second build) -------------
      # Why: CA (Unraid App Store) statistics are Docker Hub pull counts.
      # A GHCR-only image has none — the mirror gives the app real numbers
      # in the store ("Downloads"/"Trend") and readable registry metadata.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        run: |
          docker buildx imagetools create \
            --tag docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:beta \
            --tag docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:${{ steps.ver.outputs.tag }} \
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}
          echo "mirrored to docker.io/${{ secrets.DOCKERHUB_USERNAME }}/netspy:beta + :${{ steps.ver.outputs.tag }}"
