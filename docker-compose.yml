# NetSpy — ONE compose for Unraid AND TrueNAS.
# Role and connections are fully controlled by environment variables
# (see .env.example). No file changes needed between hosts.

#   Unraid (dashboard + local sampler):
#     ROLE=web
#     SERVERS="Unraid=local;TrueNAS=http://10.10.10.20:8091"
#     -> docker compose up -d   (pulls ghcr.io/thefirstmojo/netspy:latest, public)
#
#   TrueNAS (collector only, via Portainer):
#     ROLE=agent
#     SERVERS=""
#     -> Portainer: Stacks -> Add stack -> Repository (this repo) -> set Env Vars
#     -> add: security_opt: [apparmor:unconfined]  (required for process rows)
#
#   Local build (development only): docker build -t netspy:latest .
#   and then set NETSPY_IMAGE=netspy:latest.

services:
  netspy:
    image: ${NETSPY_IMAGE:-ghcr.io/thefirstmojo/netspy:latest}
    container_name: ${NETSPY_CONTAINER:-netspy}
    restart: unless-stopped

    # Host network + host PID namespace: so /proc and ss see the real host
    # data (container runs as root).
    network_mode: host
    pid: host
    cap_drop: [ALL]
    # SYS_PTRACE: needed so sockets of non-root processes can be attributed
    # via /proc/<pid>/fd.
    cap_add: [SYS_PTRACE]

    environment:
      ROLE: ${ROLE:-web}
      SERVERS: ${SERVERS:-Unraid=local}
      UPLINK: ${UPLINK:-br0}
      WEB_PORT: ${WEB_PORT:-8090}
      AGENT_PORT: ${AGENT_PORT:-8091}
      AGENT_TOKEN: ${AGENT_TOKEN:-}

    # OPTIONAL — RECOMMENDED on Unraid: enables container rows
    # (process -> container name and veth -> container in the process list).
    # Uncomment these 3 lines. Off by default so the file stays valid on
    # every compose version (Unraid/TrueNAS/Portainer).
    # Do NOT enable on TrueNAS, there is no Docker socket.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
