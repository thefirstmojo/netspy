# NetSpy — all configuration lives in this file. No .env needed.
# Copy this file to each host and adjust the values for that host.

# ────────────────────────────────────────────────────────────────────
# ROLE decides what this instance does:
#   web   = dashboard + local sampler + agent API
#           (typical: Unraid, or any Linux host)
#   agent = sampler + agent API only, feeds a web instance
#           (typical: TrueNAS, Debian, any other host)
#
# Per-host notes:
#   Unraid (web)  : UPLINK=br0, uncomment the Docker-socket block below
#                   for per-container rows.
#   TrueNAS (agent): uncomment the AppArmor block below (REQUIRED for
#                   process attribution), keep the Docker-socket block
#                   commented (no Docker socket in TrueNAS apps).
#   Debian (agent): UPLINK=eth0/enpXsY/bond0; AppArmor block only if the
#                   host enforces an AppArmor container profile; Docker
#                   socket block if you want per-container rows there.
# ────────────────────────────────────────────────────────────────────

services:
  netspy:
    # Pin a version for deterministic updates, e.g. ghcr.io/thefirstmojo/netspy:v0.3.11
    # (a new tag always forces a fresh pull; with :latest you must force re-pull)
    image: ghcr.io/thefirstmojo/netspy:latest
    container_name: netspy
    restart: unless-stopped

    # Host network + host PID namespace: /proc and ss must see the real host
    # data (container runs as root).
    network_mode: host
    pid: host
    cap_drop: [ALL]
    # SYS_PTRACE: needed to attribute sockets of non-root processes
    # via /proc/<pid>/fd.
    # Config volume: the container writes servers.yaml as root with
    # cap_drop ALL — the mounted base directory must be world-writable
    # on the host (chmod 777 /mnt/user/appdata/netspy). The container
    # creates subfolders 0777 and files 0666 itself. Do NOT add
    # DAC_OVERRIDE: that would bypass ALL file permission checks
    # inside the container.
    cap_add: [SYS_PTRACE]

    # ── Only needed when the host enforces an AppArmor profile on        ──
    # ── containers (TrueNAS always does; Debian only if AppArmor is      ──
    # ── active). Without it, ss cannot resolve processes → empty list.   ──
    # ── Uncomment on such hosts:                                         ──
    # security_opt:
    #   - apparmor:unconfined

    environment:
      # Role: web (dashboard + local sampler) or agent (collector only)
      ROLE: "web"

      # Servers the dashboard polls. Format: Name=local;Name=http://host:8091
      #   local            = sample this host directly (web role)
      #   http://host:8091 = agent API of another host (agent role)
      # (web example — adjust names/IPs to your hosts; agent hosts: "")
      SERVERS: "Main=local;Remote=http://10.10.10.20:8091"

      # Interfaces counted as "total traffic" (comma-separated).
      # EMPTY = auto: the interface(s) with the default route are used
      # (br0 on Unraid, eth0/enpXsY on Debian, bond0 with bonding) —
      # nothing to configure. Override only for special setups
      # (multiple WAN links, policy routing).
      UPLINK: ""

      # Ports. NOTE: network_mode: host -> there is NO separate container
      # port mapping (8090:8090 would be ignored). The value below IS the
      # host port:
      #   WEB_PORT=8090   -> dashboard on http://host:8090
      #   AGENT_PORT=8091 -> agent API on http://host:8091
      # Want a different port? Just change the value, e.g. WEB_PORT=9090.
      WEB_PORT: "8090"
      AGENT_PORT: "8091"

      # Shared token — MUST be identical on the web instance and every agent
      AGENT_TOKEN: "CHANGE_ME"

      # Docker socket for per-container rows — only effective together with
      # the volumes block below. Empty string disables it (default for the
      # agent role).
      DOCKER_SOCK: "/var/run/docker.sock"

    # ── Per-container throughput (veth → container names in the list)    ──
    # ── Requires a Docker socket on THIS host (Unraid, Debian with       ──
    # ── docker). Keep commented on hosts without a Docker socket         ──
    # ── (TrueNAS apps).                                                  ──
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    #
    # ── Settings page (web role): the server list can be managed in the  ──
    # ── web UI (🛠️ Settings tab) instead of the SERVERS env var. It is   ──
    # ── stored as human-editable servers.yaml in <CONFIG_DIR>. Mount a    ──
    # ── writable base directory; the /config subfolder (and later e.g.   ──
    # ── /data) is created automatically by the container:                 ──
    # ──   Unraid:  /mnt/user/appdata/netspy:/netspy                      ──
    # ──   Other:   /opt/netspy:/netspy                                   ──
    # ── WITHOUT a volume the SERVERS env var keeps working (fallback)    ──
    # ── and the settings UI shows a hint on how to add the volume.       ──
    # ── Storage fill levels (💾 Storage tab) ──────────────────────────
    # ── No extra volumes needed: the agent reads the HOST mounts via    ──
    # ── /proc/mounts + /proc/1/root (pid: host + SYS_PTRACE, see above). ──
    # CONFIG_DIR defaults to /netspy/config (auto-detected) — mount your
    # directory exactly as /netspy.
    # volumes:
    #   - /mnt/user/appdata/netspy:/netspy
