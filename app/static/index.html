<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetSpy — Network Monitoring</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=@@VERSION@@">
<script src="chart.umd.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1>NetSpy <span id="ver" class="ver"></span></h1>
    <span class="subtitle">Network Monitoring · Unraid / TrueNAS</span>
  </div>
  <div id="statusbar" class="statusbar"></div>
</header>

<main>
  <div class="filterrow">
    <div id="serverfilter" class="serverfilter"></div>
    <button id="scalebtn" class="scalebtn" title="Force the same Y-axis scale on all charts (for direct comparison)">⚖ Equal scale</button>
  </div>

  <section id="chartgrid" class="chartgrid"></section>

  <details id="procdetails" class="card" open>
    <summary>Processes by server <span class="hint">(click a column header to sort)</span></summary>
    <div class="tablewrap">
      <table id="proctable">
        <thead id="procthead"></thead>
        <tbody id="proctbody"></tbody>
      </table>
    </div>
  </details>

  <section id="ifaces" class="ifaces"></section>

  <footer>NetSpy · Sampling 1 s · History 1 h (in memory)</footer>
</main>

<script src="app.js?v=@@VERSION@@"></script>
</body>
</html>
